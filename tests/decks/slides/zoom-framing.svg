<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#222831"/>

  <!-- A wide, flat strip: the view grows vertically around it. -->
  <g id="timeline" font-family="sans-serif" font-size="20" fill="#eeeeee">
    <rect x="160" y="150" width="1600" height="8" fill="#00adb5"/>
    <text x="160" y="195">jan</text>
    <text x="560" y="195">apr</text>
    <text x="960" y="195">jul</text>
    <text x="1360" y="195">oct</text>
    <text x="1720" y="195">dec</text>
  </g>

  <!-- A tall, narrow column: the view grows sideways around it. -->
  <g id="column">
    <rect x="1720" y="300" width="80" height="680" rx="12" fill="#393e46"/>
    <rect x="1720" y="700" width="80" height="280" rx="12" fill="#00adb5"/>
  </g>

  <!-- A text element as the target, with a margin around it. -->
  <text id="tiny-label" x="300" y="700" font-family="sans-serif" font-size="16" fill="#eeeeee">a label too small to read from the back row</text>

  <!-- A rotated card inside transformed groups: the frame is its rotated bounding box. -->
  <g transform="translate(1000 640)">
    <g transform="rotate(30)">
      <rect id="rotated-card" x="-120" y="-70" width="240" height="140" rx="16" fill="#eeeeee"/>
      <text x="0" y="8" font-family="sans-serif" font-size="24" fill="#222831" text-anchor="middle">rotated</text>
    </g>
  </g>

  <!-- A frame hanging off the top-left corner: clamped back inside the canvas. -->
  <text x="40" y="70" font-family="sans-serif" font-size="28" fill="#00adb5">top-left corner</text>
  <rect id="frame-corner" x="-80" y="-40" width="480" height="270" fill="none"/>
</svg>
