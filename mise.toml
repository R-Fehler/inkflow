[tools]
uv   = "latest"
node = "lts"
pnpm = "latest"

# Pin the resolved tool versions in mise.lock for reproducible installs, while
# keeping the friendly latest/lts specs above. `mise upgrade` refreshes the lock
# (done weekly by .github/workflows/mise-lock.yml).
[settings]
lockfile = true

[tasks.install-js]
run = "pnpm install"

[tasks.lint-py]
run = "uv run ruff check"

[tasks.fmt-py]
run = "uv run ruff format --check"

[tasks.typecheck-py]
run = "uv run basedpyright"

[tasks.lint-deps]
run = "uv run deptry src"

[tasks.lint-deps-editor]
dir = "inkflow-editor"
run = "uv run deptry src"

[tasks.lint-lock]
run = "uv lock --check"

# Each package's suite in its own session (both are a package named `tests`).
# The core's tests describe the core alone, so installed plugins (this
# workspace's inkflow-editor) are turned off for them.
[tasks.test]
env = { INKFLOW_NO_PLUGINS = "1" }
run = "uv run pytest"

[tasks.test-editor]
dir = "inkflow-editor"
run = "uv run pytest"

# The core's suite where inkflow-editor is not installed at all: the core must
# never come to depend on its plugin.
[tasks.test-core]
env = { UV_PROJECT_ENVIRONMENT = ".venv-core" }
run = "uv run --no-default-groups --group test pytest"

[tasks.lint-js]
depends = ["install-js"]
run = "pnpm exec biome check ."

[tasks.typecheck-js]
depends = ["install-js"]
run = "pnpm exec tsc --noEmit"

[tasks.bundle]
depends = ["install-js"]
run = [
  "pnpm exec esbuild src/ts/presenter/main.ts --bundle --outfile=src/inkflow/bundles/presenter.js",
  "pnpm exec esbuild src/css/presenter/index.css --bundle --outfile=src/inkflow/bundles/presenter.css",
  "pnpm exec esbuild inkflow-editor/src/ts/editor/main.ts --bundle --outfile=inkflow-editor/src/inkflow_editor/bundles/editor.js",
  "pnpm exec esbuild inkflow-editor/src/css/editor/index.css --bundle --outfile=inkflow-editor/src/inkflow_editor/bundles/editor.css",
  "pnpm exec esbuild src/ts/render/main.ts --bundle --outfile=src/inkflow/bundles/render.js",
  "pnpm exec esbuild src/ts/fit/main.ts --bundle --outfile=src/inkflow/bundles/fit.js",
  "pnpm exec esbuild inkflow-editor/src/ts/guest/boot.ts --bundle --outfile=inkflow-editor/src/inkflow_editor/online/guest/_guest/boot.js",
  "pnpm exec esbuild inkflow-editor/src/ts/guest/sw.ts --bundle --outfile=inkflow-editor/src/inkflow_editor/online/guest/_guest/sw.js",
  "pnpm exec esbuild inkflow-editor/relay/cloudflare/src/worker.ts --bundle --format=esm --external:cloudflare:workers --outfile=inkflow-editor/src/inkflow_editor/online/cloudflare/worker.js",
]

[tasks.docs]
env = { NO_MKDOCS_2_WARNING = "1" }
run = ["uv run inkflow build --deck demo/deck.py --output docs/demo", "uv run mkdocs serve"]

[tasks.docs-build]
env = { NO_MKDOCS_2_WARNING = "1" }
run = ["uv run inkflow build --deck demo/deck.py --output docs/demo", "uv run mkdocs build"]

[tasks.test-js]
depends = ["install-js"]
run = "pnpm exec vitest run"

[tasks.fix-py]
run = ["uv run ruff check --fix", "uv run ruff format"]

[tasks.fix-js]
depends = ["install-js"]
run = "pnpm exec biome check --write ."

[tasks.fix]
depends = ["install-js"]
run = ["uv run ruff check --fix", "uv run ruff format", "pnpm exec biome check --write ."]

[tasks.check]
depends = ["lint-py", "fmt-py", "typecheck-py", "lint-deps", "lint-deps-editor", "lint-lock", "test", "test-editor", "test-core", "lint-js", "typecheck-js", "test-js"]
